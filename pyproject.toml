[project]
name = "raster-agent-server"
version = "0.1.0"
description = "Agent Loop 工程：技能(skill)/记忆(memory)/工具(tool)/提示词(prompt)机制 + 权限控制(guardrail)/虚拟文件系统(workspace)/沙箱(sandbox)/中间件流水线(middlewares) + Lead Agent 编排层（委派工具、REST /chat 与 /conversations）。"
authors = [
    {name = "Graham"}
]
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"

dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.38.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "python-multipart==0.0.20",
    "asyncpg==0.29.0",
    "langchain==1.3.9",
    "langchain-core==1.4.7",
    "langchain-openai==1.3.2",
    "langchain_deepseek==1.1.0",
    "langgraph==1.2.5",
    "langgraph-checkpoint-postgres==3.1.0",
    "elasticsearch==8.11.0",
    "python-dotenv==1.0.0",
    "httpx==0.28.1",
    "tavily-python==0.5.0",
    "pyyaml==6.0",
    "loguru==0.7.2",
    "redis==5.0.1",
    "docker==7.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "ruff==0.1.8",
    "black==23.12.1",
    "mypy==1.7.1",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
exclude = ["test*"]

# ── 代码规范 ──────────────────────────────────────────────────────
# 命名遵循 Python 惯用写法（PEP8：类 UpperCamelCase，函数/变量 snake_case），
# 设计原则遵循《阿里巴巴Java开发手册》中与语言无关的部分：单一职责、分层架构、
# 禁止魔法值（用常量/枚举）、完整异常分层、防御式编程（参数校验/判空）、
# 方法/类必须有规范注释（Google 风格 docstring）。详见 docs/CODING_STANDARD.md。
[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "N",  # pep8-naming
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "langchain.*",
    "elasticsearch.*",
    "tavily.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["test"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-v --tb=short"
